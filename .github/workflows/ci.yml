name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install packages
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run

      - name: Production settings
        # Fails on errors only; security warnings are printed in the log.
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-key-0123456789abcdef
          EMAIL_HOST: smtp.example.com
        run: python manage.py check --deploy

      - name: Tests (including browser tests)
        run: pytest --screenshot only-on-failure

      - name: Keep browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
