[project]
name = "school-portal"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "school_portal.settings"
testpaths = ["tests"]
markers = ["browser: opens the site in Chromium (skip with -m 'not browser')"]
# WhiteNoise warns that collectstatic hasn't run; tests don't need it.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
# docs/ holds design notes whose code samples are fragments, not runnable files.
extend-exclude = ["*/migrations/*", "docs"]

[tool.ruff.lint]
# Django's class-level list options (list_display, ordering, ...) are the framework idiom.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests build local wall-clock times and pass them through timezone.make_aware().
"tests/*" = ["DTZ001"]
