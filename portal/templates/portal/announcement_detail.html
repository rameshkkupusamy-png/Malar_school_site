{% extends "portal/base.html" %}

{% block title %}{{ announcement.title }}, {{ school_name }}{% endblock %}

{% block content %}
<article class="prose">
  <h1>{{ announcement.title }}</h1>
  <p class="meta"><time datetime="{{ announcement.published_at|date:'c' }}">{{ announcement.published_at|date:"j F Y" }}</time></p>
  {{ announcement.body|linebreaks }}
  <p class="more"><a href="{% url 'portal:announcement_list' %}">Back to all news</a></p>
</article>
{% endblock %}
